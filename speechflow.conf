# speechflow.conf – Einstellungen für speechflow-start.py
# KEY=VALUE, Kommentare mit #. Fehlt eine Zeile oder die ganze Datei,
# gelten die Standardwerte im Skript.

# Sprache: de, en, fr, es, pt
# (Normalisierung von Zahlen/Datums + Auswahl des Standard-Modells)
LANG=de

# Modell. Leer lassen = Standard-Modell der Sprache oben
# (z.B. hf://gradium/phonon-40m-de). Alle 5 Sprachen in einem Modell:
#MODEL=hf://gradium/phonon-40m-multilingual
MODEL=

# Stimme. Leer lassen = passende Standardstimme des Modells zur Sprache.
# Alle Stimmen auflisten:  uvx ptts --list-voices
# Deutsch z.B.: Nele, Annika, Anton, Mirko, Leon, Mika, Svea, Henrik, Jette
# Englisch z.B.: Harper, Maeve, Toby, Zoey, Juniper
# Achtung: Stimme zur Sprache passend wählen!
VOICE=

# Gewichtsformat: q8 (klein, schnell, Standard) oder f32 (genauer, größer)
QUANT=q8

# Ordner for the WAV archive files (one timestamped file per reading).
ARCHIVE_DIR=~/text-to-sound-recordings
