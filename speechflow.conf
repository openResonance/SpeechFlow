
# ============================================================
# SPEECHFLOW — CONFIGURATION / KONFIGURATION
# ============================================================

# DE: Hier stellst du alles Wichtige ein, um SpeechFlow
#     an deine Wünsche anzupassen.
# EN: Configure everything you need to customize SpeechFlow.


# ============================================================
# 2. LANGUAGE MODEL / SPRACHMODELL
# ============================================================

# DE: Hier wählst du das Modell aus, das deinen Text in
#     Sprache umwandelt.
# EN: Choose the model that converts your text into speech.
#
# DE: Entferne die Raute (#) vor EINEM Modell, um es zu
#     aktivieren. Füge sie wieder hinzu, um es zu deaktivieren.
# EN: Remove the # before ONE model to activate it.
#     Add the # again to deactivate it.
#
# DE: Beim ersten Start eines neuen Modells öffnet sich
#     die entsprechende Seite auf Hugging Face.
#     Du benötigst ein kostenloses Hugging-Face-Konto
#     und musst die Modelllizenz akzeptieren.
# EN: When using a new model for the first time, its
#     Hugging Face page will open.
#     You need a free Hugging Face account and must
#     accept the model's license.
#
# DE: Diese Freigabe dient der Kontrolle der Modellnutzung.
#     Anschließend läuft die Spracherzeugung lokal auf
#     deinem Linux-Rechner.
# EN: This approval helps control access to the models.
#     Afterwards, speech generation runs locally
#     on your Linux computer.
#
# DE: Aktiviere nur EIN Modell gleichzeitig!
# EN: Activate only ONE model at a time!

#MODEL=hf://gradium/phonon-40m-de
#MODEL=hf://gradium/phonon-40m-fr
MODEL=hf://gradium/phonon-40m-en
#MODEL=hf://gradium/phonon-40m-es
#MODEL=hf://gradium/phonon-40m-pt


# ============================================================
# 3. VOICE SELECTION / SPRECHERAUSWAHL
# ============================================================

# DE: Hier wählst du die Stimme für deine Sprache.
# EN: Choose the voice for your selected language.
#
# DE: Entferne die Raute (#) vor VOICE=, um eine
#     Stimme zu aktivieren.
# EN: Remove the # before VOICE= to activate a voice.
#
# DE: Füge die Raute wieder hinzu, um sie zu deaktivieren.
# EN: Add the # again to deactivate it.
#
# DE: Ist keine Stimme ausgewählt, verwendet SpeechFlow
#     die Standardstimme des Modells.
# EN: If no voice is selected, SpeechFlow uses the
#     model's default voice.
#
# DE: Aktiviere immer nur EINE Stimme gleichzeitig!
# EN: Always activate only ONE voice at a time!
#
# DE: Verwende ausschließlich Stimmen, die zur Sprache
#     deines Modells passen. Andernfalls kann die
#     Sprachausgabe ungewöhnlich klingen.
# EN: Only use voices matching your model's language.
#     Otherwise, the speech may sound unusual.
#
# DE: Vergiss nicht, deine Änderungen zu speichern!
# EN: Don't forget to save your changes!


